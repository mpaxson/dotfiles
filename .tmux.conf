
# Prevent plugin-spawned git commands (tmux2k, tmux-gh, etc.) from taking
# .git/index.lock during status-bar refreshes. Without this, plain
# `git status` races with local write operations (just git::version,
# just git::preflight-fix) and leaves stale index.lock files behind.
set-environment -g GIT_OPTIONAL_LOCKS 0

# Plugins live under XDG; tpm must be told, and must run LAST (bottom of file).
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-gh'
set -g @plugin 'tmux-plugins/tmux-df'
set -g @plugin '2kabhishek/tmux2k'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'soyuka/tmux-current-pane-hostname'
set -g @plugin 'tmux-plugins/tmux-mem-cpu-load'
set -g @plugin 'tardunge/tmux-gh'

set-option -g @themepack-status-right-area-right-format "#{tmux_gh_uname}"

# --- session persistence (resurrect + continuum) ---
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# Restore scrollback, not just geometry.
set -g @resurrect-capture-pane-contents 'on'

# Resurrect's default whitelist is only vi/vim/nvim/emacs/man/less/more/tail/
# top/htop/irssi/weechat/mutt. Every pane here runs claude, so without this
# they all come back as bare shells. '~' = match by prefix, restore full cmd.
set -g @resurrect-processes '"~claude" "~nvim" "~ssh" "~btop" "~htop" "~lazygit" "~k9s" "~just"'

# Continuum restores into a headless server before any client attaches, so
# windows get built at default-size and the layout is permanently crushed to
# fit. Match the real terminal so layouts restore at full size.
set -g default-size '277x68'
set -g @tmux2k-time-format '%I:%M %p'
set -g @tmux2k-cpu-colors "red black" # set cpu plugin bg to red, fg to black
set -g @tmux2k-ram-colors "red black" # set ram plugin bg to red, fg to black
set -g @tmux2k-gpu-colors "red black" # set gpu plugin bg to red, fg to black

set -g @tmux2k-session-colors "orange black" # set gpu plugin bg to red, fg to black

set -g @tmux2k-group-delimiter '|' 
set -g @tmux2k-group-colors 'red black' 
# edit this status plugins in the bin/tmux-resize-status.sh file
set-hook -g client-resized "run-shell ~/bin/tmux-resize-hook.sh"
set -g @tmux2k-group-delimiter '|' 

set -g @tmux2k-group-colors 'red black' 

set -g @tmux2k-theme 'onedark'
set -g @tmux2k-git-no-repo-icon ""
set -g status-interval 1
set -g @tmux2k-git-no-repo-icon ""
set -g @tmux2k-refresh-rate 1

# Set the history limit so we get lots of scrollback.
setw -g history-limit 50000


unbind C-b
set -g prefix C-Space
bind Space send-prefix

#reload config
bind-key r source-file ~/.tmux.conf \; display "Reloaded from ~/.tmux.conf (dotfiles)"

#pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key q display-panes
set -g mouse on
setw -g mode-keys vi

#window navigation
bind-key C-a last-window
bind-key c new-window
bind-key t next-window
bind-key T previous-window

#press shift wtih mouse to copy
#copy text to clipboard
#move x clipboard into tmux paste buffer
#bind C-p run "tmux set-buffer \"$(xclip -o)\"; tmux paste buffer"
#bind C-y run "tmux save-buffer - | xclip -i"
set -g set-clipboard on
set -g allow-passthrough on
set -g copy-command 'pbcopy'

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel

bind-key P run-shell 'pbpaste | tmux load-buffer -' \; paste-buffer
#unbind -T copy-mode MouseDragEnd1Panea
#bind-key -T copymode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "reattach-to-user-namespace-pbcopy"
#bind-key -t vi-copy MouseDragEnd1Pane copy-pipe "xclip -in -selection clipboard"
#bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
#bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
#copy mode
#bind-key Escape copy-mode
#bind-key Enter copy-mode

bind-key ] paste-buffer

# copy-mode-vi page navigation with Shift+j/k/l/m
bind-key -T copy-mode-vi J send-keys -X page-down
bind-key -T copy-mode-vi K send-keys -X page-up
bind-key -T copy-mode-vi L send-keys -X page-down
bind-key -T copy-mode-vi M send-keys -X page-up

set -g history-limit 5000000

# This prevents issues with bracketed paste in some terminals
#set -g set-clipboard on
set -g xterm-keys on
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
set -ga terminal-overrides ',xterm*:bracketed-paste:enable'
    

set -g xterm-keys on

run-shell '~/bin/tmux-set-plugins.sh'

# MUST be the last line: tpm reads every @plugin / @resurrect-* / @continuum-*
# option at load time. Anything set after this point is invisible to plugins.
run '~/.config/tmux/plugins/tpm/tpm'
